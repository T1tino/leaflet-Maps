<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Genera un token dinámico basado en la fecha/hora actual o versión del build
        const appVersion = "1.0.2"; // Sube este número cada vez que hagas cambios importantes
        
        // Inyecta loading-screen.js evitando la caché del navegador
        const script = document.createElement('script');
        script.src = `loading-screen.js?v=${appVersion}`;
        document.head.appendChild(script);
    </script>  
    <title>System Loading - Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="notes.css"> 
    <link rel="stylesheet" href="map.css"> 
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #app-frame-wrapper { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            max-width: 950px; 
            height: 650px; 
            background: #1e293b; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            overflow: hidden; 
            position: relative; 
        }
        
        #map-area { 
            flex: 1; 
            position: relative; 
            background: #0f172a; 
            display: flex; 
            flex-direction: row; 
            overflow: hidden; 
        }

        #map { 
            flex: 1; 
            height: 100%; 
        }

        .sheet {
            width: 0; 
            height: 100%;
            background: #1e293b;
            z-index: 3000;
            overflow: hidden;
            transition: width 0.3s ease; 
            display: flex;
            flex-direction: column;
            border-left: 0px solid #334155;
            flex-shrink: 0;
        }

        .sheet.open {
            width: 340px;
            border-left: 1px solid #334155;
        }

        .sheet-hd {
            padding: 15px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            white-space: nowrap;
        }
        .sheet-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #94a3b8; text-transform: uppercase; }
        .sheet-close { background: none; border: none; font-size: 16px; cursor: pointer; color: #94a3b8; }
        .sheet-body { padding: 15px; overflow-y: auto; flex: 1; color: #cbd5e1; width: 340px; box-sizing: border-box; }

        #sync-footer-panel { background: #1e293b; padding: 14px 20px; border-top: 1px solid #334155; z-index: 2000; }
        .bt-progress-container { width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; margin-bottom: 6px; border: 1px solid #334155; }
        .bt-progress-fill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.3s ease; }
        
        #place-sheet {
            position: absolute;
            top: 12px;
            right: 12px;
            bottom: 70px;
            width: 340px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            box-shadow: -4px 0 20px rgba(0,0,0,0.5);
            z-index: 1000;
            transform: translateX(110%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #place-sheet.open {
            transform: translateX(0);
        }

        #clinic-info-body {
            padding: 14px;
            overflow-y: auto;
            flex-grow: 1;
        }

        #clinic-info-body::-webkit-scrollbar { width: 6px; }
        #clinic-info-body::-webkit-scrollbar-track { background: #0f172a; }
        #clinic-info-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="app-frame-wrapper">
        <div id="map-area">
            <div id="map"></div>

            <aside id="place-sheet" class="sheet" aria-hidden="true">
                <div class="sheet-hd">
                    <div class="sheet-title">Selected Clinic</div>
                    <button class="sheet-close" title="Close" onclick="closeSheet()">✕</button>
                </div>
                <div class="sheet-body" id="clinic-info-body">
                    <div style="text-align: center; color: #64748b; margin-top: 40px;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 8px; opacity: 0.5;">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <div>Click on a map marker or select a clinic from the map dropdown menu.</div>
                    </div>
                </div>
            </aside>
        </div>

        <div id="sync-footer-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <p id="sync-status" style="font-size: 12px; color: #94a3b8; margin: 0;">Waiting to orchestrate sync...</p>
                <span style="font-size: 11px; color: #64748b;">STATUS: <span id="bt-state-text" style="color: #38bdf8;">IDLE</span></span>
            </div>
            <div class="bt-progress-container">
                <div id="bt-progress-bar" class="bt-progress-fill"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; font-size: 10px; color: #38bdf8;">
                <span id="bt-percentage">0%</span>
            </div>
        </div>
    </div>

    <!-- Carga de la librería del mapa -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts independientes listos para ser controlados -->
    <script src="loading-screen-W-LOGS.js?v=1.0.3"></script>
    <script src="map-lite.js?v=1.0.3"></script>
    <script src="data-loader.js?v=1.0.3"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log("🚀 [LSEngine] Iniciando secuencia única de carga...");
                
                // 1. Petición única de datos principales (acción "load" + guardado OPFS)
                await window.LSEngine.taskFetchMainDataLite();

                // 2. Pintar el mapa de inmediato
                const mapLoaded = window.LSEngine.initializeMap();

                if (mapLoaded) {
                    console.log("📍 Mapa operativo. Procediendo con la sincronización y descarga en segundo plano...");
                    
                    // 3. Ejecutamos el resto de los procesos pesados usando read_leader (Pasos 1, 2 y 4)
                    if (typeof read_leader === 'function') {
                        await read_leader([1, 2, 4]);
                    }
                }
            } catch (err) {
                console.error("❌ Error en el flujo principal de LSEngine:", err);
                window.LSEngine.setProgress(100, "Error crítico en el sistema", "ERROR");
            }
        });
    </script>
</body>
</html>
